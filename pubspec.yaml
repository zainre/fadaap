name: fadaa_app
description: تطبيق سديم - شبكة تواصل اجتماعي مستقبلية مدعومة بالذكاء الاصطناعي من تطوير زين العابدين.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ✨ دعم اللغة العربية بشكل أساسي
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Backend & Auth (Supabase)
  supabase_flutter: ^2.3.0
  
  # AI Integration (Gemini)
  google_generative_ai: ^0.2.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  
  # UI & Styling
  cached_network_image: ^3.3.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # Utilities
  intl: ^0.20.2
  image_picker: any
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
